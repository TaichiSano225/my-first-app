services:
  # バックエンド: FastAPI (株価取得 API)
  backend:
    build: .
    image: stock-checker-backend
    ports:
      # 直接 API を叩きたいとき用（無くても frontend 経由で動く）
      # ホスト側は 8100。8000 は別プロジェクトのコンテナが使っているため避ける。
      - "8100:8000"
    restart: unless-stopped

  # フロントエンド: React を nginx で HTTPS 配信し、/api をバックエンドへ中継
  frontend:
    build: ./frontend
    image: stock-checker-frontend
    ports:
      # https://localhost:3100 でアクセス（自己署名証明書）
      # 3000 は別プロジェクトのコンテナが使っているため避ける。
      - "3100:443"
    depends_on:
      - backend
    restart: unless-stopped
